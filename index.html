<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blueprint Flex</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--card:#161b22;--card2:#1c2128;--text:#e6edf3;--dim:#7d8590;--border:#30363d;--line:#21262d;
  --easy:#58a6ff;--quality:#f0883e;--long:#8b5cf6;--strength:#3fb950;--deload:#3fb950;--warn:#f85149;--gold:#e3b341;
  --display:'Barlow Condensed',system-ui,sans-serif;
  --body:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--easy);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:12px 16px 88px;padding:calc(12px + env(safe-area-inset-top)) 16px calc(88px + env(safe-area-inset-bottom))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:.01em}
.icon-btn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--dim);flex:none}
.icon-btn:hover{background:var(--card);color:var(--text)}

/* week header */
.weekhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.weekno{font-family:var(--display);font-weight:800;font-size:2.5rem;line-height:1}
.phase{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid}
.phase.build{color:var(--easy);border-color:#1f4a7a;background:#0f2438}
.phase.deload{color:var(--deload);border-color:#1e5a2b;background:#0e2515}
.cycle{display:flex;gap:6px;margin:14px 0 6px}
.pill{flex:1;height:8px;border-radius:4px;background:var(--card2)}
.pill.done{background:#1f4a7a}
.pill.now{background:var(--easy)}
.pill.dl{background:#173320}
.pill.dl.now{background:var(--deload)}
.cyclenote{font-size:.82rem;color:var(--dim)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 8px}
.stat{background:var(--card);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:1.55rem;line-height:1.1;font-weight:700}
.stat span{font-size:.76rem;color:var(--dim)}
.banner{background:#2a2110;border:1px solid #5b4514;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.86rem}
.banner button{color:var(--gold);font-weight:600;margin-top:4px;display:block}

/* days and sessions */
.day{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.dlabel{font-family:var(--display);font-weight:700;font-size:1.2rem;color:var(--dim);padding-top:10px}
.day.today .dlabel{color:var(--text)}
.today-dot{display:block;width:6px;height:6px;border-radius:50%;background:var(--easy);margin-top:1px}
.stack{display:flex;flex-direction:column;gap:6px;min-width:0}
.rest{color:#4b535d;font-size:.86rem;padding:10px 0}
.sc{display:flex;align-items:stretch;background:var(--card);border-radius:10px;border-left:4px solid var(--c,var(--easy));min-width:0}
.sc.choose{background:transparent;border:1px dashed var(--c);border-left:4px solid var(--c)}
.sc .main{flex:1 1 auto;min-width:0;padding:10px 8px 10px 12px;display:block;cursor:pointer}
.sc .t{display:block;font-weight:600}
.sc .s{display:block;font-size:.82rem;color:var(--dim)}
.sc.choose .s{color:var(--c)}
.sc .tickwrap{display:flex;align-items:center;justify-content:center;flex:none;width:48px;padding:0 12px 0 4px}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid #3b434c;display:flex;align-items:center;justify-content:center;flex:none}
.sc.done{opacity:.62}
.sc.done .tick{background:var(--c);border-color:var(--c)}
.finish{margin-top:14px}
.linkbtn{display:block;margin:12px auto 0;color:var(--dim);font-size:.85rem;text-decoration:underline;text-underline-offset:3px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(13,17,23,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--border);z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{display:flex;max-width:560px;margin:0 auto}
.tabs button{flex:1;padding:13px 0 12px;font-size:.8rem;font-weight:600;color:var(--dim);text-align:center}
.tabs button[aria-current=page]{color:var(--text);box-shadow:inset 0 2px 0 var(--easy)}

/* generic sections */
.sec-title{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.1;margin:6px 0 4px}
.hint{font-size:.82rem;color:var(--dim);margin-top:6px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.pc{background:var(--card);border-radius:10px;padding:11px 12px;border-top:3px solid var(--c)}
.pc .n{font-size:.8rem;color:var(--dim)}
.pc .v{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.15}
.pc .d{font-size:.78rem;color:var(--dim);margin-top:2px}
table.tt{width:100%;border-collapse:collapse;margin-top:10px;font-size:.88rem}
.tt th,.tt td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
.tt th{font-weight:600;color:var(--dim);font-size:.78rem}
.tt td{font-variant-numeric:tabular-nums}
.empty{background:var(--card);border-radius:10px;padding:16px;margin-top:12px;color:var(--dim);font-size:.9rem}
.bars{display:flex;align-items:flex-end;gap:6px;height:96px;margin-top:12px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.7rem;color:var(--dim)}
.bar i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--easy);min-height:3px}
.bar i.dl{background:var(--deload)}
.list{margin-top:8px}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.li span:last-child{color:var(--dim);text-align:right}
.dots{display:inline-flex;gap:3px;vertical-align:middle;margin-left:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--card2);display:block}
.dots i.on{background:var(--quality)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(1,4,9,.68);opacity:0;pointer-events:none;transition:opacity .18s;z-index:20}
.overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:90vh;overflow-y:auto;background:var(--card);border-radius:18px 18px 0 0;border:1px solid var(--border);border-bottom:0;transform:translateY(104%);transition:transform .22s ease,visibility 0s linear .22s;z-index:21;padding:8px 16px 24px;padding:8px 16px calc(24px + env(safe-area-inset-bottom));visibility:hidden}
.sheet.on{transform:none;visibility:visible;transition:transform .22s ease,visibility 0s}
.grab{width:40px;height:4px;border-radius:2px;background:#3b434c;margin:4px auto 12px}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.sh-title{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.08}
.sh-sub{color:var(--dim);font-size:.86rem;margin-top:2px}
.block{background:var(--card2);border-radius:10px;padding:11px 13px;margin-top:10px}
.block h4{font-size:.8rem;font-weight:600;color:var(--dim);margin-bottom:4px}
.block p{padding:2px 0}
.block .big{font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.2}
.bigmin{font-family:var(--display);font-weight:800;font-size:3rem;line-height:1;margin-top:8px}
.bigmin small{font-size:1.2rem;font-weight:700;color:var(--dim);margin-left:4px}
.btn{display:block;width:100%;text-align:center;padding:13px;border-radius:10px;font-weight:600;margin-top:10px;border:1px solid var(--border)}
.btn.pri{background:var(--easy);color:#04101d;border-color:var(--easy)}
.btn.ok{background:var(--strength);color:#04140a;border-color:var(--strength)}
.btn.warn{color:var(--warn);border-color:#5b2323}
.btn.sm{padding:10px;font-size:.9rem}
.opt{display:block;width:100%;cursor:pointer;background:var(--card2);border-radius:10px;padding:11px 13px;margin-top:8px;border-left:4px solid var(--c,var(--quality))}
.opt .t{display:block;font-weight:600}
.opt .s{display:block;clear:both;font-size:.82rem;color:var(--dim);margin-top:1px}
.tag{float:right;margin-left:8px;font-size:.72rem;font-weight:600;color:var(--c,var(--quality));white-space:nowrap}
.grp{font-size:.82rem;font-weight:600;color:var(--dim);margin:16px 0 0}
.grp small{display:block;font-weight:400;font-size:.78rem}
.chips{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.chips button{padding:8px 0;border-radius:8px;border:1px solid var(--border);font-size:.82rem;font-weight:600;color:var(--dim);text-align:center}
.chips button[aria-pressed=true]{background:var(--card2);color:var(--text);border-color:var(--text)}
.seg{display:flex;gap:5px}
.seg button{flex:1 1 0;min-width:0;padding:10px 0;border-radius:8px;border:1px solid var(--border);font-weight:600;text-align:center}
.seg button[aria-pressed=true]{background:var(--easy);color:#04101d;border-color:var(--easy)}
.field{margin-top:16px}
.field label{display:block;font-size:.86rem;color:var(--dim);margin-bottom:6px}
.field input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.err{color:var(--warn);font-size:.82rem;margin-top:6px}
.ex{background:var(--card2);border-radius:10px;padding:11px 13px;margin-top:10px}
.ex .nm{font-weight:600}
.ex .nt{font-size:.8rem;color:var(--dim);margin-top:1px}
.ex .tg{font-size:.84rem;margin-top:6px}
.ex .last{font-size:.78rem;color:var(--dim)}
.logrow{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.logrow label{font-size:.76rem;color:var(--dim);width:100%}
.logrow input{width:64px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center}
.logrow input[data-k=w]{width:76px;border-color:#2c4a35;margin-right:6px}
.toast{position:fixed;left:50%;bottom:76px;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#e6edf3;color:#0d1117;padding:9px 14px;border-radius:99px;font-size:.86rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:30;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){.sheet,.overlay,.toast{transition:none}}
.pc .v small{font-size:.9rem;color:var(--dim);margin-left:2px;font-weight:600}
/* v2 additions */
.sc{position:relative;user-select:none;-webkit-user-select:none}
.grip{display:flex;align-items:center;justify-content:center;width:26px;height:44px;flex:none;color:#4b535d;cursor:grab;touch-action:none;align-self:center}
.grip svg{fill:currentColor}
.sc.lifting{opacity:.35}
.sc.ghost{position:fixed;z-index:40;pointer-events:none;box-shadow:0 12px 32px rgba(0,0,0,.6);opacity:.95}
.day.over{background:#121a24;border-radius:10px}
.day.over .dlabel{color:var(--easy)}
button.rest{display:block;width:100%;text-align:left;color:#4b535d;font-size:.86rem;padding:10px 0}
button.rest span{display:block;font-size:.74rem;color:#3b434c}
.dnote{font-size:.74rem;color:var(--dim);padding:0 0 4px 4px}
.sec-title.sub{font-size:1.2rem;margin-top:18px}
.warnb{border-left:3px solid var(--gold)}
.block.next{border-left:3px solid var(--easy)}
.exh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exh > div{flex:1 1 auto;min-width:0}
.swap{flex:0 0 auto;width:52px;text-align:center;font-size:.78rem;font-weight:600;color:var(--easy);padding:4px 0;border:1px solid #1f4a7a;border-radius:8px;margin-top:2px;cursor:pointer}
.steps{display:flex;gap:6px;margin:4px 0 14px}
.steps span{flex:1;height:5px;border-radius:3px;background:var(--card2)}
.steps span.done{background:#1f4a7a}
.steps span.now{background:var(--easy)}
.row{display:flex;gap:8px;margin-top:4px}
.btn.half{flex:1;margin-top:10px}
.seg button{padding:10px 2px;font-size:.86rem;line-height:1.2;min-width:0}
textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:inherit;color:var(--text);font-size:.78rem;word-break:break-all}
.btn.sm.warn{margin-top:8px}
.dnote.warn{color:var(--gold)}
.top .brand{flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;padding:5px 10px;border-radius:99px;border:1px solid var(--border);color:var(--dim);margin-right:4px;flex:none}
.sync i{display:block;width:7px;height:7px;border-radius:50%;background:var(--dim)}
.sync.ok{color:var(--strength);border-color:#1e5a2b}.sync.ok i{background:var(--strength)}
.sync.syncing{color:var(--easy);border-color:#1f4a7a}.sync.syncing i{background:var(--easy)}
.sync.local,.sync.fail{color:var(--gold);border-color:#5b4514}.sync.local i,.sync.fail i{background:var(--gold)}
.hint.warnhint{color:var(--gold)}
.top .brand{white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:1.4rem}
.sync span{white-space:nowrap}

</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">Blueprint Flex</div>
    <button class="sync local" id="sync" data-act="syncpill" aria-label="Cloud sync status"><i></i><span>Phone only</span></button>
    <button class="icon-btn" data-act="settings" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>
  <main id="view"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-act="tab" data-arg="week" aria-current="page">Week</button>
  <button data-act="tab" data-arg="paces">Paces</button>
  <button data-act="tab" data-arg="progress">Progress</button>
</div></nav>
<div class="overlay" id="ov"></div>
<div class="sheet" id="sh" tabindex="-1" role="dialog" aria-modal="true" aria-label="Details"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!-- Per-person deploy: set a key here and the site syncs that person without a ?u= link. Leave empty for one shared site with ?u=name links. -->
<script>window.FLEX_KEY = '';</script>
<!-- Firebase, same project as Blueprint, its own "flex" collection -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
(function(){
'use strict';
/* ============ exercise library ============
   pat: movement pattern (sessions are built from pattern slots)
   eq: equipment levels this exercise works with: gym, db (dumbbells and bands), bw (bodyweight)
   tr: tracked with weight and reps (double progression); otherwise reps or time only
   Order within a pattern is priority: the first exercise that fits the equipment is the default. */
const EXL = [
  /* squat: heavy bilateral first (near-maximal loads are what improve running economy), high-SFR machine next, then single-leg and bodyweight */
  {id:'bsq', pat:'squat', eq:['gym'], n:'Back squat', nt:'Heavy and low reps. Brace, sit between your hips, full depth you can control. This is the lift that pays off in running economy.', tr:true, sets:3, lo:4, hi:6, inc:2.5},
  {id:'hack', pat:'squat', eq:['gym'], n:'Hack squat or pendulum squat', nt:'Deep, with the knees travelling forward. Lots of quad stimulus for very little fatigue elsewhere.', tr:true, sets:3, lo:6, hi:10, inc:5},
  {id:'lp', pat:'squat', eq:['gym'], n:'Leg press', nt:'Full range without your lower back rounding off the pad. Pause at the bottom where the muscle is longest.', tr:true, sets:3, lo:8, hi:12, inc:5},
  {id:'fsq', pat:'squat', eq:['gym'], n:'Front squat', nt:'Elbows high, chest up. Lighter than a back squat and kinder on the back.', tr:true, sets:3, lo:4, hi:6, inc:2.5},
  {id:'gob', pat:'squat', eq:['gym','db'], n:'Goblet squat', nt:'Dumbbell at your chest, elbows inside your knees at the bottom. Pause there.', tr:true, sets:3, lo:8, hi:12, inc:2},
  {id:'bwsq', pat:'squat', eq:['bw'], n:'Tempo squat', nt:'Three seconds down, pause at the bottom, drive up. Load a rucksack if you have one.', tr:false, sets:3, per:'12 to 15'},
  /* hinge: long-length hamstring work first, heavy pull for strength, hip thrust for the glutes at short length */
  {id:'rdl', pat:'hinge', eq:['gym'], n:'Romanian deadlift', nt:'Hips back, bar on your thighs, flat back. Go as low as your hamstrings allow and pause there: that stretched position is where the growth happens.', tr:true, sets:3, lo:6, hi:8, inc:5},
  {id:'ht', pat:'hinge', eq:['gym'], n:'Barbell hip thrust', nt:'Chin tucked, ribs down, squeeze for a second at the top. Covers the part of the glute that a deadlift misses.', tr:true, sets:3, lo:8, hi:12, inc:5},
  {id:'tbdl', pat:'hinge', eq:['gym'], n:'Trap bar deadlift', nt:'Heavy and low reps. Push the floor away. Easier to learn than a straight bar and just as useful.', tr:true, sets:3, lo:4, hi:6, inc:5},
  {id:'dbrdl', pat:'hinge', eq:['gym','db'], n:'Dumbbell Romanian deadlift', nt:'Weight is per dumbbell. Dumbbells down your legs, hips back, pause at the bottom.', tr:true, sets:3, lo:8, hi:10, inc:2},
  {id:'slrdl', pat:'hinge', eq:['gym','db','bw'], n:'Single-leg Romanian deadlift', nt:'One dumbbell or none. Reps are each side. Slow and balanced beats heavy.', tr:true, sets:3, lo:8, hi:10, inc:2},
  {id:'gbr', pat:'hinge', eq:['bw'], n:'Glute bridge', nt:'Drive through your heels, squeeze at the top. Add a pause or a single leg to make it harder.', tr:false, sets:3, per:'15'},
  /* knee flexion: the hamstring region a hinge does not cover; Nordics are the best-evidenced injury exercise there is */
  {id:'nordic', pat:'kflex', eq:['gym','db','bw'], n:'Nordic hamstring curl', nt:'Feet anchored, lower yourself as slowly as you can, catch yourself with your hands and push back up. Start with 2 sets of 3 and build. Expect soreness the first weeks.', tr:false, sets:2, per:'3 to 6 slow lowers'},
  {id:'legcurl', pat:'kflex', eq:['gym'], n:'Seated leg curl', nt:'Seated beats lying: the hamstring is longer at the hip. Pause at the stretched top.', tr:true, sets:3, lo:8, hi:12, inc:2.5},
  {id:'slider', pat:'kflex', eq:['db','bw'], n:'Slider or towel leg curl', nt:'Bridge up, slide your heels out slowly, pull them back. Slow on the way out.', tr:false, sets:3, per:'8 to 12'},
  /* single leg: the running-specific pattern */
  {id:'bss', pat:'lunge', eq:['gym','db','bw'], n:'Bulgarian split squat', nt:'Weight is per dumbbell. Reps are each side. Front shin close to vertical, sink until the back knee is just off the floor.', tr:true, sets:3, lo:8, hi:10, inc:2},
  {id:'rlu', pat:'lunge', eq:['gym','db','bw'], n:'Reverse lunge', nt:'Step back, knee just off the floor, drive through the front heel. Reps are each side.', tr:true, sets:3, lo:8, hi:10, inc:2},
  {id:'stp', pat:'lunge', eq:['gym','db','bw'], n:'Step-up', nt:'Box at knee height. Push through the top foot, do not jump off the bottom one. Reps are each side.', tr:true, sets:3, lo:8, hi:10, inc:2},

const qualitySlots = () => tpl().filter(s => s.type === 'quality');

const planLong = () => { /* decide this week's long run once, at week start */

  w.lrPlanned = w.no; w.lrv = 'easy';
  const L = vol(w.level, w.kind === 'deload').L, hasLong = S.template.some(s => s.type === 'long');
  if (!hasLong || w.kind === 'deload' || beginner() || L < 60 || S.lrLastStructured === w.no - 1) return;

  if (S.lrSeq % period === 0) { w.lrv = rot[(S.lrStruct || 0) % rot.length]; S.lrStruct = (S.lrStruct || 0) + 1; S.lrLastStructured = w.no; }

const syncQ2 = () => { /* keep the second quality slot in step with the gate, without rebuilding the week */
  const p = S.profile, qs = qualitySlots(), want = p.secondQ && p.runDays >= 4 && q2Earned(p).ok;

    const gap = (a, b) => { const x = (DAYS.indexOf(b) - DAYS.indexOf(a) + 7) % 7; return Math.min(x, 7 - x); };
    const cand = S.template.filter(s => s.type === 'easy' && (!Q1 || gap(Q1.day, s.day) >= 2) && (!L || gap(L.day, s.day) >= 2)).sort((a, b) => DAYS.indexOf(b.day) - DAYS.indexOf(a.day));

/* ============ session info for cards ============ */
const sessInfo = s => {

  const capTxt = easyCap() ? ', under ' + easyCap() + ' bpm' : (p ? ', slower than ' + fmtPace(p.easy) + '/km' : ', easy effort');
  if (s.type === 'easy') { const m = v[s.role] || v.E2; return {t:'Easy run', s:m + ' min' + capTxt + (s.strides ? ', plus strides' : ''), c:'easy', min:m}; }

const weekWarnings = () => { /* day -> note, for clashes the user has created by moving things */
  const list = tpl(), notes = {}, byDay = {};
  list.forEach(x => { byDay[x.day] = byDay[x.day] || []; byDay[x.day].push(x); });
  DAYS.forEach(d => {
    const ss = (byDay[d] || []).filter(x => x.type === 'strength' && SS[x.key]);
    ss.forEach(x => {
      const prev = (byDay[prevDay(d)] || []).filter(y => y.type === 'strength' && SS[y.key] && CLASH[SS[x.key].grp].indexOf(SS[y.key].grp) >= 0);
      if (prev.length) notes[d] = SS[x.key].name + ' straight after ' + SS[prev[0].key].name + ': the same muscles need about 48 hours. Move one of them.';
      else if (SS[x.key].lower && (byDay[nextDay(d)] || []).some(y => y.type === 'quality' || y.type === 'long')) notes[d] = notes[d] || 'Heavy legs the day before a hard run. An upper or hips-and-core session fits better here.';

/* ============ heart rate ============ */
const hasHR = () => S.profile.hrMode === 'zone' || S.profile.hrMode === 'karvonen';
const hrr = f => Math.round(S.profile.rhr + f*(S.profile.mhr - S.profile.rhr));
const easyCap = () => { const p = S.profile; if (p.hrMode === 'zone' && p.hrCap) return p.hrCap; if (p.hrMode === 'karvonen' && p.mhr && p.rhr) return hrr(0.70); return null; };
const hrZones = () => { const p = S.profile; if (p.hrMode !== 'karvonen' || !p.mhr || !p.rhr) return null; return [['Zone 1', hrr(0.5), hrr(0.6), 'Warm-up and recovery jogs'], ['Zone 2', hrr(0.6), hrr(0.7), 'Easy and long runs'], ['Zone 3', hrr(0.7), hrr(0.8), 'Steady, and late in long runs'], ['Zone 4', hrr(0.8), hrr(0.9), 'Marathon pace and threshold'], ['Zone 5', hrr(0.9), p.mhr, 'Intervals and strides, briefly']]; };
const easyZoneName = () => S.profile.watch === 'coros' ? 'Aerobic Endurance' : 'Zone 2';

/* ============ long run builder ============ */
const buildLong = (lrv, min) => {
  const p = P(), cap = easyCap(), o = {blocks:[], hard:lrv !== 'easy'};
  const ctl = cap ? 'keep your heart rate under ' + cap + ' bpm' : (p ? 'slower than ' + fmtPace(p.easy) + '/km' : 'full sentences the whole way');
  if (lrv === 'prog') {
    const t = Math.round(min/3/5)*5;
    o.blocks.push(['First ' + t + ' min', 'Easy, ' + ctl + '.']);
    o.blocks.push(['Middle ' + t + ' min', 'Steady: a gear up, short sentences only.']);
    o.blocks.push(['Final ' + (min - 2*t) + ' min', 'Build so the last 10 minutes are at threshold, ' + pn('thr') + '. If that last part is a fight, you started too fast.']);
  } else if (lrv === 'fast') {
    const f = Math.max(15, Math.round(min*0.25/5)*5), k = S.profile.goal === 'marathon' ? 'mp' : 'hm';
    o.blocks.push(['First ' + (min - f) + ' min', 'Easy, ' + ctl + '.']);
    o.blocks.push(['Final ' + f + ' min', 'At ' + (k === 'mp' ? 'marathon' : 'half marathon') + ' pace, ' + pn(k) + '. Practise pushing when tired.']);
  } else if (lrv === 'mp') {
    const total = Math.min(MP_LADDER[Math.min(S.mpLevel || 0, MP_LADDER.length - 1)], Math.round(min*0.4/5)*5), n = total >= 30 ? (total >= 40 ? 2 : 3) : 2, each = Math.round(total/n);
    const easy = Math.max(10, Math.round((min - total)/(n + 1)/5)*5);
    o.blocks.push(['Easy ' + easy + ' min', ctl + ' to start.']);
    for (let i = 0; i < n; i++) { o.blocks.push([each + ' min at marathon pace', pn('mp') + '. Let your heart rate rise here; that is correct.']); if (i < n - 1) o.blocks.push(['Easy ' + easy + ' min', 'Recover, ' + ctl + '.']); }

};

const q2Earned = p => {
  p = p || S.profile;

  if (beginner()) reasons.push('a longest run over 30 minutes and a 5K under 35 minutes');
  if (hist.length < 8) reasons.push((8 - hist.length) + ' more finished ' + (8 - hist.length === 1 ? 'week' : 'weeks'));
  const tough = hist.slice(-4).some(h => h.feel === 'tough'); if (tough) reasons.push('four weeks without a week marked too much');
  if (p.age && p.age >= 50) reasons.push('not available over 50: the evidence wants 72 hours between hard runs, and three cannot fit in a week');
  if ((S.q2pauseUntil || 0) > S.week.no) reasons.push('week ' + S.q2pauseUntil + ', paused after a hard patch');
  const q3 = (S.qfb || []).slice(-3); if (q3.length === 3 && q3.every(x => x.fb === 'struggled')) reasons.push('a smoother run of quality sessions');

  let h = head(k ? 'Change your code' : 'Link this phone', k ? 'Your code ties your plan to you, so it survives a new phone or cleared browser data.' : 'New here? Just answer the setup questions and a code is made for you at the end. Only use this if you already have one.');
  if (!k) h += '<button class="btn pri" data-act="newcode">Create my code</button><p class="hint" style="text-align:center">or enter the code you already have</p>';
  h += '<div class="field"><label for="lcode">Your code</label><input id="lcode" type="text" autocapitalize="none" autocomplete="off" spellcheck="false" placeholder="like k7m2-x9pq" value="' + esc(k || '') + '"><p class="hint">It was shown when you first set up, and it is under Progress, Back up or restore, on any phone that has your plan.</p></div><div id="lerr" class="err" role="alert"></div><button class="btn ' + (k ? 'pri' : '') + '" data-act="dolink">Link and load my plan</button>';
  openSheet(h);
};
const doLink = () => {
  const k = normKey($('lcode').value), err = $('lerr');
  if (k.length < 3) { err.textContent = 'Codes are at least 3 letters or numbers, like george-bm.'; return; }
  if (!window.fbLoad) { setSync('fail'); err.textContent = 'Cannot reach the cloud right now. Check your connection and try again.'; return; }
  err.textContent = ''; pendingCloud = null;
  window.fbLoad(k).then(cloud => {
    try { localStorage.setItem(KEYSTORE, k); } catch (e) {}
    setManifest(); cloudReady = false; setSync('syncing');
    const hadSetup = !!S.profile.setup, cloudSet = !!(cloud && cloud.v === 2 && cloud.profile && cloud.profile.setup);
    reconcile(cloud);
    if (!pendingCloud && !cloudSet) {
      closeSheet(); render();
      if (!hadSetup) { qz = null; openSetup(true); toast('Linked. Nothing saved under that code yet, so let\u2019s set you up'); }
      else toast('Linked. Your plan is now saved to the cloud');
    }
  }, () => { setSync('fail'); err.textContent = 'Could not reach the cloud. Try again in a minute.'; });
};

/* ============ actions ============ */
const act = {
  tab: a => { S.tab = a; save(); render(); toTop(); },
  settings: () => openSetup(!S.profile.setup),
  close: () => closeSheet(),
  qnext: () => { if (!qz) return; const err = readSetupInputs(); if (err) { $('seterr').textContent = err; return; } if (qz.step < QSTEPS.length - 1) { qz.step++; renderSetup(); } else finishSetup(); },
  qback: () => { if (!qz) return; readSetupInputs(); if (qz.step > 0) qz.step--; renderSetup(); },
  seg: (a, t) => {
    const key = t.getAttribute('data-key'), val = isNaN(+a) || key === 'freeDay' ? a : +a;
    t.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === t ? 'true' : 'false'));
    if (qz) { qz.d[key] = val; if (key === 'hrMode' || key === 'watch') { readSetupInputs(); const box = $('hrfields'); if (box) box.innerHTML = hrFields(qz.d); } }
    if (ci && (key === 'feel' || key === 'repeat')) { if (key === 'feel') ci.feel = val; else ci.repeat = val === 1; openCheckin(); }
  },
  open: a => { const s = slotById(a); if (!s) return; if (s.type === 'quality') openQ(s); else if (s.type === 'strength') openS(s); else openRun(s); },
  tick: (a, t) => {
    const s = slotById(a), pe = $('epace');
    if (s && pe && (s.type === 'easy' || s.type === 'long') && !S.week.done[a]) { const sec = parseTime(pe.value); if (sec && sec > 150 && sec < 900) S.easyLog = (S.easyLog || []).concat([{no:S.week.no, pace:sec, cap:easyCap()}]).slice(-60); }
    tickSlot(a); if (t.getAttribute('data-close') && (!s || s.type !== 'quality' || (S.week.q2off && isQ2(s)) || !qById(S.week.picks[a]))) closeSheet();
  },
  qfb: a => { const x = a.split('|'); tickSlot(x[0], x[1]); closeSheet(); },
  longeasy: a => { const s = slotById(a); if (!s) return; S.week.lrv = 'easy'; S.lrLastStructured = 0; S.week.q2off = false; autoPick(); save(); closeSheet(); render(); toast('Easy long run this week'); },
  pickq: a => { const x = a.split('|'), s = slotById(x[0]); if (!s) return; S.week.picks[x[0]] = x[1]; delete S.week.auto[x[0]]; save(); render(); openQ(s); },
  changeq: a => { const s = slotById(a); if (s) openQPicker(s); },
  picks: a => { const x = a.split('|'), s = slotById(x[0]); if (!s) return; s.key = x[1]; save(); render(); closeSheet(); toast(SS[x[1]].name + ' on ' + DAYLONG[s.day]); },
  schange: a => { const s = slotById(a); if (s) openSPicker(s); },
  swap: a => { const x = a.split('|'); openSwap(x[0], +x[1]); },
  doswap: a => { const x = a.split('|'); S.swaps[x[0]] = S.swaps[x[0]] || {}; S.swaps[x[0]][x[1]] = x[2]; save(); const s = curS ? slotById(curS) : null; if (s && s.key === x[0]) openS(s); else closeSheet(); toast('Swapped to ' + EXMAP[x[2]].n); },
  move: a => { const x = a.split('|'), s = slotById(x[0]); if (!s) return; s.day = x[1]; save(); closeSheet(); render(); toast('Moved to ' + DAYLONG[x[1]]); },
  add: a => openAdd(a),
  doadd: a => {
    const x = a.split('|'), type = x[1], s = {id:uid(type === 'strength' ? 's' : 'r'), type:type, day:x[0], strides:false};
    if (type === 'easy') s.role = 'E2';
    S.template.push(s); autoPick(); save(); render(); closeSheet();
    if (type === 'strength') openSPicker(s); else toast(TYPENAME[type] + ' added to ' + DAYLONG[x[0]]);
  },
  retype: a => { const x = a.split('|'), s = slotById(x[0]); if (!s) return; s.type = x[1]; if (x[1] === 'easy') { s.role = s.role || 'E2'; delete S.week.picks[s.id]; delete S.week.auto[s.id]; } delete S.week.done[s.id]; autoPick(); save(); closeSheet(); render(); toast('Changed to ' + TYPENAME[x[1]].toLowerCase()); },
  remove: (a, t) => { if (!t.getAttribute('data-sure')) { t.setAttribute('data-sure', '1'); t.textContent = 'Tap again to remove it'; return; } S.template = S.template.filter(s => s.id !== a); delete S.week.done[a]; delete S.week.picks[a]; save(); closeSheet(); render(); toast('Removed'); },
  checkin: () => { ci = null; openCheckin(); },
  finishweek: () => finishWeek(),
  lighter: () => openLighter(),
  lighterok: () => { const w = S.week; if (w.kind !== 'deload') { w.kind = 'deload'; w.resume = w.level; } closeSheet(); save(); render(); toast('Switched to a lighter week'); },
  retest: () => openRetest(),
  saveretest: () => {
    const sec = parseTime($('fnew').value);
    if (sec === null || sec < 720 || sec > 3600) { $('rerr').textContent = 'Enter the 5K as minutes and seconds, like 24:30.'; return; }
    S.profile.fiveK = sec; S.profile.testWeek = S.week.no; save(); closeSheet(); render(); toast('Paces updated');
  },
  backup: () => openBackup(),
  link: () => openLink(),
  newcode: () => createCode(false),
  copylink: a => { const u = location.origin + '/?u=' + a; if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(() => toast('Link copied'), () => toast(u)); else toast(u); },
  dolink: () => doLink(),
  syncpill: () => { if (pendingCloud) askWhich(pendingCloud); else if (syncKey()) openBackup(); else openLink(); },
  keepcloud: () => { if (pendingCloud) takeCloud(pendingCloud); },
  keeplocal: () => { pendingCloud = null; cloudReady = true; closeSheet(); save(); render(); toast('Kept this phone\u2019s plan and saved it to the cloud'); },
  copybk: () => { const el = $('bk'); el.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(el.value).then(() => toast('Copied'), () => {}); else toast(ok ? 'Copied' : 'Select the code and copy it'); },
  restore: () => {
    try { const o = JSON.parse(decodeURIComponent(escape(atob($('rs').value.trim())))); if (!o || o.v !== 2 || !o.profile) throw new Error('bad'); S = merge(fresh(), o); save(); closeSheet(); render(); toast('Restored'); }
    catch (e) { $('rserr').textContent = 'That code did not work. Paste the whole thing, with nothing added.'; }
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!t) return;
  const a = t.getAttribute('data-act');
  if (act[a]) act[a](t.getAttribute('data-arg'), t, e);
});
document.addEventListener('input', e => {
  const t = e.target, ex = t.getAttribute && t.getAttribute('data-ex');
  if (!ex || !curS) return;
  const lg = S.week.logs[curS] = S.week.logs[curS] || {}, o = lg[ex] = lg[ex] || {r:[]};
  if (t.getAttribute('data-k') === 'w') o.w = t.value; else o.r[+t.getAttribute('data-i')] = t.value;
  save();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  const t = e.target;
  if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button' && t.getAttribute('data-act')) { e.preventDefault(); t.click(); }
});
ov.addEventListener('click', closeSheet);

/* ============ boot ============ */
setStatus = msg => { const el = $('syncline'); if (el) el.textContent = msg; };
if (S.profile.setup) { autoPick(); save(true); }
render();
if (!S.profile.setup) openSetup(true);
setManifest();
setSync(syncKey() ? 'syncing' : 'local');
if (window.fbLoad) cloudBoot(); else window.addEventListener('firebaseReady', cloudBoot);
setTimeout(() => { if (syncKey() && !window.fbLoad) setSync('fail'); }, 6000);
window.addEventListener('online', () => { if (!syncKey()) return; if (pendingCloud) return; if (cloudReady) pushCloud(); else cloudBoot(); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('/sw.js').catch(() => {});


})();
</script>
</body>
